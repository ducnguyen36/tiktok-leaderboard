<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171614"><meta name="robots" content="noindex,nofollow"><title>Helios Talent · Cuộc thi</title><link rel="stylesheet" href="/competition.css"><script defer src="/competition.js"></script></head><body>
<header class="top"><img class="logo" src="/helios-asset-23.png" alt=""><div class="top-text"><div class="brand">Helios Talent</div><h1 id="comp-name">Cuộc thi</h1><p class="meta"><span id="comp-status" class="badge" hidden></span><span id="updated"></span></p></div></header>
<main>
  <section id="loading-view" class="card center">Đang tải…</section>
  <section id="missing-view" class="card center" hidden>Không tìm thấy cuộc thi.</section>
  <section id="request-view" class="card" hidden>
    <form id="request-form" autocomplete="on"><label for="request-name">Nhập tên của bạn</label><input id="request-name" name="name" maxlength="60" required autocomplete="name"><button type="submit" class="primary">Gửi yêu cầu xem</button></form>
    <p id="request-note" class="note">Quản trị viên Helios sẽ duyệt yêu cầu của bạn.</p>
  </section>
  <section id="pending-view" class="card center" hidden><p>Đã gửi yêu cầu với tên <b id="pending-name"></b>.</p><p class="note">Vui lòng chờ quản trị viên duyệt. Trang sẽ tự mở bảng điểm khi được duyệt.</p></section>
  <section id="board-view" hidden>
    <div class="toolbar"><div class="modes" role="group" aria-label="Chế độ điểm"><button type="button" data-mode="competition" aria-pressed="true" aria-label="Cuộc thi" title="Cuộc thi"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 5h3v2a4 4 0 0 1-4 4M7 5H4v2a4 4 0 0 0 4 4"/></svg></button><button type="button" data-mode="overall" aria-pressed="false" aria-label="Tổng cộng" title="Tổng cộng"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 5H6l6 7-6 7h12"/></svg></button></div><button type="button" id="groups-toggle" class="chip icon-chip" aria-pressed="false" aria-label="Nhóm" title="Nhóm"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0M16 4.5a3 3 0 0 1 0 6M18 20a6 6 0 0 0-3-5.2"/></svg></button><button type="button" id="standings-toggle" class="chip icon-chip" aria-pressed="false" aria-label="Bảng chung cuộc" title="Bảng chung cuộc" hidden><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 21V9h6v12M3 21v-7h6M15 21v-5h6M3 21h18"/></svg></button><button type="button" id="out-toggle" class="chip eye" aria-pressed="false" hidden><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="M4 4l16 16"/></svg><span id="out-count">0</span></button><button type="button" id="snapshot-button" class="icon-button" aria-label="Chụp snapshot" title="Chụp snapshot" hidden><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg></button></div>
    <div class="pager"><button type="button" id="prev-page" class="arrow" aria-label="Trang trước">‹</button><div id="dots" class="dots"></div><button type="button" id="next-page" class="arrow" aria-label="Trang sau">›</button></div>
    <div id="pages" class="pages" tabindex="0" aria-label="Bảng điểm"></div>
  </section>
  <section id="admin-view" class="card" hidden><h2>Quản lý người xem</h2><div id="admin-list" class="admin-list"></div></section>
</main>
<div id="toast" class="toast" role="status" hidden></div>
<dialog id="name-dialog"><form method="dialog" id="name-form"><h2 id="name-title">Chụp snapshot</h2><label for="name-input">Tên snapshot</label><input id="name-input" maxlength="60" required><div class="actions"><button type="button" id="name-cancel">Hủy</button><button type="submit" class="primary" id="name-confirm">Xác nhận</button></div></form></dialog>
</body></html>
